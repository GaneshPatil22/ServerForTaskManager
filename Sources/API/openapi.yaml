openapi: '3.1.0'
info:
  title: Brain API
  version: 1.0.0
  description: |
    Dump anything. It organises it, finds what depends on what, and tells you
    the one thing to do next.

    **Rules every endpoint follows**

    - Every request needs a Supabase access token (`Authorization: Bearer`).
      401 for a missing or bad token; 503 if the server cannot reach
      Supabase's keys, so apps should retry, not log the user out.
    - Ids belonging to another user behave exactly like ids that do not
      exist: **404, never 403**, so ids cannot be probed.
    - The client generates ids (ULIDs) for what it creates. Sending the same
      create twice is safe: the second call returns what is stored with 200.
    - Captures are never deleted or edited. Items are finished or dropped
      through `status`.
    - Every classified field says who decided it (`decidedBy`), so the app can
      show "suggested" differently from "you said".

    Each operation names the build step that implements it (S3, S4, S5).
servers:
  - url: /
security:
  - supabase: []

paths:
  /v1/me:
    get:
      operationId: getMe
      summary: The signed-in user. Created on first call. (S3)
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateMe
      summary: Change the user's timezone. "Today" is computed in it. (S3)
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MeUpdate'}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /v1/captures:
    post:
      operationId: createCapture
      summary: Dump anything. Stored before the response is sent. (S3)
      description: |
        The capture is committed to the database before this returns, and is
        never lost after that, whatever happens to enrichment. Enrichment
        runs in the background (S4); the capture starts as `raw`.

        Retrying with the same `id` returns the stored capture with 200, even
        if the retry's text differs: captures are never edited.

        `capturedAt` is when the user typed it, which may be long before an
        offline phone syncs. A time in the future is replaced by the server's
        time. A capture is never refused for its timestamp.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NewCapture'}}}
      responses:
        '201': {description: Stored., content: {application/json: {schema: {$ref: '#/components/schemas/Capture'}}}}
        '200': {description: Already stored by an earlier call with this id., content: {application/json: {schema: {$ref: '#/components/schemas/Capture'}}}}
        default: {$ref: '#/components/responses/Problem'}
    get:
      operationId: listCaptures
      summary: Captures, oldest first. (S3)
      parameters:
        - {$ref: '#/components/parameters/After'}
        - {$ref: '#/components/parameters/Limit'}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/CaptureStatus'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/CapturePage'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /v1/captures/{id}:
    get:
      operationId: getCapture
      summary: One capture. (S3)
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Capture'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /v1/items:
    get:
      operationId: listItems
      summary: Items, oldest first. (S3)
      parameters:
        - {$ref: '#/components/parameters/After'}
        - {$ref: '#/components/parameters/Limit'}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/ItemStatus'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ItemPage'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /v1/items/{id}:
    get:
      operationId: getItem
      summary: One item. (S3)
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Item'}}}}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateItem
      summary: The user changes an item. Each change is recorded as a correction. (S5)
      description: |
        Every field changed here is set with `decidedBy: user`, and a
        correction is recorded against whichever tier had decided it. Those
        corrections are what personalisation learns from (Brain B6).
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ItemUpdate'}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Item'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /v1/goals:
    get:
      operationId: listGoals
      summary: All goals, or one month's or quarter's. (S3, P4)
      parameters:
        - name: period
          in: query
          description: Only goals of this period, e.g. `2026-11` or `2026-Q4`.
          schema: {$ref: '#/components/schemas/Period'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/GoalList'}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createGoal
      summary: Goals are only ever created by the user, never invented. (S3)
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NewGoal'}}}
      responses:
        '201': {description: Created., content: {application/json: {schema: {$ref: '#/components/schemas/Goal'}}}}
        '200': {description: Already created with this id., content: {application/json: {schema: {$ref: '#/components/schemas/Goal'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /v1/goals/{id}:
    patch:
      operationId: updateGoal
      summary: Rename a goal, change its status, period or parent. (S3, P4)
      description: |
        A month goal may name a quarter goal as its parent only if that
        quarter contains the month; anything else is 400 `invalid_rollup`.
        Changing a quarter's period is refused the same way if a month goal
        rolling up into it would no longer fit. `targetCount` makes it a
        count goal; lowering it below the circles already filled, or clearing
        it while any are filled, is 400 `target_below_done`.
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/GoalUpdate'}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Goal'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /v1/goals/{id}/marks:
    get:
      operationId: listGoalMarks
      summary: The filled circles of a count goal, oldest day first.
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/GoalMarkList'}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: addGoalMark
      summary: Fill one circle of a count goal.
      description: |
        `day` defaults to today in the user's timezone and may not be in the
        future (400 `in_future`). 400 `not_a_count_goal` if the goal has no
        `targetCount`; 409 `target_reached` when every circle is filled
        (raising the target is the user's call). Filling the last circle does
        not mark the goal achieved. Idempotent on `id`.
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NewGoalMark'}}}
      responses:
        '201': {description: Created., content: {application/json: {schema: {$ref: '#/components/schemas/GoalMark'}}}}
        '200': {description: Already created with this id., content: {application/json: {schema: {$ref: '#/components/schemas/GoalMark'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /v1/goals/{id}/marks/{markId}:
    patch:
      operationId: updateGoalMark
      summary: Change or remove a filled circle's note.
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/MarkId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/GoalMarkUpdate'}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/GoalMark'}}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteGoalMark
      summary: Empty a circle.
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/MarkId'}
      responses:
        '204': {description: Emptied.}
        default: {$ref: '#/components/responses/Problem'}

  /v1/comments:
    get:
      operationId: listComments
      summary: The comments on one item, goal or commitment, oldest first.
      description: |
        Name exactly one of `itemId`, `goalId`, `commitmentId` (else 400
        `one_target`). Comments are the user's own notes: Brain never reads
        them and they are never sent to a model.
      parameters:
        - {name: itemId, in: query, schema: {$ref: '#/components/schemas/ULID'}}
        - {name: goalId, in: query, schema: {$ref: '#/components/schemas/ULID'}}
        - {name: commitmentId, in: query, schema: {$ref: '#/components/schemas/ULID'}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/CommentList'}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createComment
      summary: Comment on one item, goal or commitment. Idempotent on `id`.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NewComment'}}}
      responses:
        '201': {description: Created., content: {application/json: {schema: {$ref: '#/components/schemas/Comment'}}}}
        '200': {description: Already created with this id., content: {application/json: {schema: {$ref: '#/components/schemas/Comment'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /v1/comments/{id}:
    patch:
      operationId: updateComment
      summary: Rewrite a comment.
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CommentUpdate'}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Comment'}}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteComment
      summary: Delete a comment.
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '204': {description: Deleted.}
        default: {$ref: '#/components/responses/Problem'}

  /v1/plan:
    get:
      operationId: getPlan
      summary: The one thing to do next, and everything behind it. (S5)
      description: |
        Computed by Brain's deterministic scoring from the user's graph, in
        the user's timezone. No model takes part.

        `next` is the top item that can be started now, and is absent when
        nothing can. A blocked item may still rank first in `ranked`, with
        its blockers listed in `blocked`.

        `commitments` is today's standing commitments, a **separate section**:
        commitments are scheduled, never ranked, and never appear in
        `ranked`. `day` is today in the user's timezone. `committedMinutes`
        is what is still owed to them today; nothing subtracts it for you.
        `bigTask` is today's confirmed big task, if the user confirmed one.
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Plan'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /v1/commitments:
    get:
      operationId: listCommitments
      summary: The user's commitments (habits, rituals, payments, blocks). (P4)
      description: Archived (deleted) ones are left out.
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/CommitmentList'}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createCommitment
      summary: Commit to something that recurs. (P4)
      description: |
        Commitments are not items: they are scheduled, never ranked. Only the
        rule is stored; the days it falls on are worked out when asked for.
        `note` is free text such as "22k" and is never parsed or added up.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NewCommitment'}}}
      responses:
        '201': {description: Created., content: {application/json: {schema: {$ref: '#/components/schemas/Commitment'}}}}
        '200': {description: Already created with this id., content: {application/json: {schema: {$ref: '#/components/schemas/Commitment'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /v1/commitments/{id}:
    get:
      operationId: getCommitment
      summary: One commitment. (P4)
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Commitment'}}}}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateCommitment
      summary: Change a commitment. Only the fields sent change. (P4)
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CommitmentUpdate'}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Commitment'}}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteCommitment
      summary: Delete a commitment. Its history stays for the reviews. (P4)
      description: |
        The commitment disappears from lists and the plan and ends today; the
        days it was done stay, so past reviews do not change.
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '204': {description: Deleted.}
        default: {$ref: '#/components/responses/Problem'}

  /v1/commitments/{id}/occurrences/{day}:
    put:
      operationId: setOccurrence
      summary: Mark one day of a commitment done, skipped or moved. (P4)
      description: |
        `day` is a day the commitment falls on (400 `not_scheduled`
        otherwise). Done is refused for a day that has not come yet
        (400 `in_future`). Moving needs `movedTo`; the occurrence then shows
        on that day, and marking it done later counts for the original day.
        There is no "missed": a day left alone is a miss once it has passed.
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/Day'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OccurrenceUpdate'}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Occurrence'}}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: clearOccurrence
      summary: Undo. The day goes back to having no state. (P4)
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/Day'}
      responses:
        '204': {description: 'Cleared, or there was nothing to clear.'}
        default: {$ref: '#/components/responses/Problem'}

  /v1/occurrences:
    get:
      operationId: listOccurrences
      summary: Every day each commitment falls on in a range, with its state. (P4)
      description: |
        Worked out on request from the rules; at most 92 days. An occurrence
        moved into the range from outside it is included; place each one on
        `movedTo` if present, otherwise on `day`.
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/Through'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/OccurrenceList'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /v1/journal:
    get:
      operationId: listJournal
      summary: Journal entries in a range, oldest first. At most 92 days. (P4)
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/Through'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/JournalList'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /v1/journal/{day}:
    put:
      operationId: writeJournal
      summary: Write the day's entry, replacing any earlier text. (P4)
      description: One entry per day. Not an item. A day that has not come yet is 400 `in_future`.
      parameters: [{$ref: '#/components/parameters/Day'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/JournalWrite'}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/JournalEntry'}}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteJournal
      summary: Delete the day's entry. (P4)
      parameters: [{$ref: '#/components/parameters/Day'}]
      responses:
        '204': {description: 'Deleted, or there was none.'}
        default: {$ref: '#/components/responses/Problem'}

  /v1/daily-plans:
    get:
      operationId: listDailyPlans
      summary: Confirmed big tasks in a range. At most 92 days. (P4)
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/Through'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DailyPlanList'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /v1/daily-plans/{day}:
    put:
      operationId: confirmDailyPlan
      summary: Confirm the day's big task. Choosing another than Brain's is a swap. (P4)
      description: |
        Send the item Brain proposed (the plan's `next` as shown) as
        `proposedItemId`. If `itemId` differs, the swap is recorded as a
        correction: it is what teaches the ranking. `day` may be yesterday,
        today or tomorrow (the evening planning ritual), else 400
        `day_out_of_range`. The item must be open (400 `item_not_open`), and
        both it and `proposedItemId` must be something the plan holds: not an
        idea or a note (400 `item_not_actionable`). An item whose type is not
        yet known is allowed, as the plan ranks it.
      parameters: [{$ref: '#/components/parameters/Day'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DailyPlanConfirm'}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DailyPlan'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /v1/review:
    get:
      operationId: getReview
      summary: How a week, month or quarter went. At most 92 days. (P4)
      description: |
        Per commitment: days expected, done, skipped, moved and not yet done,
        missed, the hit rate and the current streak. Goals whose month or
        quarter overlaps the range, each with the month goals rolling up into
        it. Counts of journal entries and confirmed big tasks, and how many
        were swaps. No amounts are ever added up.
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/Through'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Review'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /v1/edges:
    get:
      operationId: listEdges
      summary: Links between items. Unconfirmed ones are suggestions. (S5)
      parameters:
        - name: confirmed
          in: query
          schema: {type: boolean}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/EdgeList'}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createEdge
      summary: The user links two items. Confirmed from the start. (S5)
      description: A `blocks` link that would create a cycle is refused with 409.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NewEdge'}}}
      responses:
        '201': {description: Created., content: {application/json: {schema: {$ref: '#/components/schemas/Edge'}}}}
        '200': {description: Already created with this id., content: {application/json: {schema: {$ref: '#/components/schemas/Edge'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /v1/edges/{id}/confirm:
    post:
      operationId: confirmEdge
      summary: Accept a suggested link. (S5)
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Edge'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /v1/edges/{id}/reject:
    post:
      operationId: rejectEdge
      summary: Turn down a suggested link. It is not suggested again. (S5)
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '204': {description: Rejected.}
        default: {$ref: '#/components/responses/Problem'}

  /v1/questions:
    get:
      operationId: listQuestions
      summary: Questions Brain asks instead of guessing (tier T3).
      description: This user's unanswered questions, newest first, at most 50.
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/QuestionList'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /v1/questions/{id}/answer:
    post:
      operationId: answerQuestion
      summary: Answer with one of the offered options.
      description: >-
        Sets the item's field as the user's decision and records a `t3`
        correction. Answering again with the same option changes nothing.
        400 `not_an_option` if the option is not one of the question's own;
        409 `already_answered` if it was answered with a different option
        (edit the item instead).
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Answer'}}}
      responses:
        '204': {description: Answered.}
        default: {$ref: '#/components/responses/Problem'}

components:
  securitySchemes:
    supabase:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Supabase access token, ES256 or RS256. Anonymous users are refused.

  parameters:
    MarkId:
      name: markId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ULID'}
    Id:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ULID'}
    After:
      name: after
      in: query
      description: Return rows after this id. Use `nextCursor` from the previous page.
      schema: {$ref: '#/components/schemas/ULID'}
    Day:
      name: day
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Day'}
    From:
      name: from
      in: query
      required: true
      schema: {$ref: '#/components/schemas/Day'}
    Through:
      name: through
      in: query
      required: true
      description: Inclusive.
      schema: {$ref: '#/components/schemas/Day'}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 500, default: 100}

  responses:
    Problem:
      description: |
        400 invalid input · 401 bad token · 404 not found (or not yours) ·
        409 conflict, e.g. a cycle · 503 try again later
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}

  schemas:
    ULID:
      type: string
      description: Crockford base32, 26 characters, sorts by creation time.
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      example: 01JDQ5Z8X3V7K2M9N4P6R8T0W1

    Problem:
      type: object
      required: [code, message]
      properties:
        code: {type: string, description: 'Stable, machine-readable, e.g. `cycle`, `invalid_timezone`.'}
        message: {type: string, description: For people. Never contains another user's data.}

    DecidedBy:
      type: string
      description: |
        Who set a value: `t0` rules, `t1` our own model, `t2` a global model,
        `t3` the user answering a question, `user` the user directly.
      enum: [t0, t1, t2, t3, user]

    Span:
      type: object
      description: Characters of the capture text the value came from.
      required: [start, end]
      properties:
        start: {type: integer, minimum: 0}
        end: {type: integer, minimum: 0}

    # A Classified<T> per value type. `value` absent means "unknown", which
    # is always legal and never an error.
    ClassifiedItemType:
      type: object
      required: [confidence, decidedBy]
      properties:
        value: {$ref: '#/components/schemas/ItemType'}
        confidence: {type: number, minimum: 0, maximum: 1}
        decidedBy: {$ref: '#/components/schemas/DecidedBy'}
        evidence: {$ref: '#/components/schemas/Span'}
    ClassifiedEffort:
      type: object
      required: [confidence, decidedBy]
      properties:
        value: {$ref: '#/components/schemas/Effort'}
        confidence: {type: number, minimum: 0, maximum: 1}
        decidedBy: {$ref: '#/components/schemas/DecidedBy'}
        evidence: {$ref: '#/components/schemas/Span'}
    ClassifiedDate:
      type: object
      required: [confidence, decidedBy]
      properties:
        value: {type: string, format: date-time}
        confidence: {type: number, minimum: 0, maximum: 1}
        decidedBy: {$ref: '#/components/schemas/DecidedBy'}
        evidence: {$ref: '#/components/schemas/Span'}
    ClassifiedGoal:
      type: object
      required: [confidence, decidedBy]
      properties:
        value: {$ref: '#/components/schemas/ULID'}
        confidence: {type: number, minimum: 0, maximum: 1}
        decidedBy: {$ref: '#/components/schemas/DecidedBy'}
        evidence: {$ref: '#/components/schemas/Span'}
    ClassifiedCategory:
      type: object
      required: [confidence, decidedBy]
      properties:
        value: {$ref: '#/components/schemas/Category'}
        confidence: {type: number, minimum: 0, maximum: 1}
        decidedBy: {$ref: '#/components/schemas/DecidedBy'}
        evidence: {$ref: '#/components/schemas/Span'}

    Me:
      type: object
      required: [userId, timezone]
      properties:
        userId: {type: string, format: uuid}
        timezone: {type: string, description: IANA name., example: Asia/Kolkata}
    MeUpdate:
      type: object
      required: [timezone]
      properties:
        timezone: {type: string, description: 'IANA name. Unknown names are refused with 400.'}

    CaptureSource: {type: string, enum: [text, voice, image, share]}
    CaptureStatus:
      type: string
      description: '`failed` is always retried; it never means lost.'
      enum: [raw, enriching, enriched, failed]
    NewCapture:
      type: object
      required: [id, text]
      properties:
        id: {$ref: '#/components/schemas/ULID'}
        text: {type: string, minLength: 1, maxLength: 20000}
        source: {$ref: '#/components/schemas/CaptureSource'}
        capturedAt: {type: string, format: date-time, description: Defaults to the server's time.}
    Capture:
      type: object
      required: [id, text, source, status, capturedAt]
      properties:
        id: {$ref: '#/components/schemas/ULID'}
        text: {type: string}
        source: {$ref: '#/components/schemas/CaptureSource'}
        status: {$ref: '#/components/schemas/CaptureStatus'}
        capturedAt: {type: string, format: date-time}
    CapturePage:
      type: object
      required: [captures]
      properties:
        captures: {type: array, items: {$ref: '#/components/schemas/Capture'}}
        nextCursor: {$ref: '#/components/schemas/ULID'}

    ItemType: {type: string, enum: [task, idea, note, reminder, link]}
    ItemStatus: {type: string, enum: [open, done, dropped]}
    Effort:
      type: string
      description: 'Roughly 5, 20, 60, 240, 960 minutes. `unknown` scores as medium.'
      enum: [tiny, small, medium, large, xlarge, unknown]
    Category:
      type: string
      enum: [paperwork, errands, communication, planning, deepWork, chores, money, learning, health]
    Item:
      type: object
      required: [id, title, status, type, effort, dueAt, goal, category, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/ULID'}
        captureId: {$ref: '#/components/schemas/ULID'}
        title: {type: string}
        status: {$ref: '#/components/schemas/ItemStatus'}
        type: {$ref: '#/components/schemas/ClassifiedItemType'}
        effort: {$ref: '#/components/schemas/ClassifiedEffort'}
        dueAt: {$ref: '#/components/schemas/ClassifiedDate'}
        goal: {$ref: '#/components/schemas/ClassifiedGoal'}
        category: {$ref: '#/components/schemas/ClassifiedCategory'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ItemUpdate:
      type: object
      description: Only the fields sent are changed. Clearing a value is not supported in v1.
      properties:
        title: {type: string, minLength: 1, maxLength: 500}
        status: {$ref: '#/components/schemas/ItemStatus'}
        type: {$ref: '#/components/schemas/ItemType'}
        effort: {$ref: '#/components/schemas/Effort'}
        dueAt: {type: string, format: date-time}
        goalId: {$ref: '#/components/schemas/ULID'}
        category: {$ref: '#/components/schemas/Category'}
    ItemPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Item'}}
        nextCursor: {$ref: '#/components/schemas/ULID'}

    GoalStatus: {type: string, enum: [active, achieved, abandoned]}
    NewGoal:
      type: object
      required: [id, title]
      properties:
        id: {$ref: '#/components/schemas/ULID'}
        title: {type: string, minLength: 1, maxLength: 500}
        period: {$ref: '#/components/schemas/Period'}
        parentId: {$ref: '#/components/schemas/ULID'}
        targetCount: {$ref: '#/components/schemas/TargetCount'}
    GoalUpdate:
      type: object
      properties:
        title: {type: string, minLength: 1, maxLength: 500}
        status: {$ref: '#/components/schemas/GoalStatus'}
        period: {$ref: '#/components/schemas/Period'}
        parentId: {$ref: '#/components/schemas/ULID'}
        targetCount: {$ref: '#/components/schemas/TargetCount'}
        clear:
          type: array
          description: Fields to remove. A field may not be both sent and cleared.
          items: {type: string, enum: [period, parentId, targetCount]}
    Goal:
      type: object
      required: [id, title, status, createdAt]
      properties:
        id: {$ref: '#/components/schemas/ULID'}
        title: {type: string}
        status: {$ref: '#/components/schemas/GoalStatus'}
        createdAt: {type: string, format: date-time}
        period: {$ref: '#/components/schemas/Period'}
        periodText: {type: string, description: 'For display, e.g. "November 2026", "Q4 2026".'}
        parentId: {$ref: '#/components/schemas/ULID'}
        targetCount: {$ref: '#/components/schemas/TargetCount'}
        doneCount: {type: integer, minimum: 0, description: 'Circles filled. Present exactly when `targetCount` is.'}
    GoalList:
      type: object
      required: [goals]
      properties:
        goals: {type: array, items: {$ref: '#/components/schemas/Goal'}}

    EdgeKind:
      type: string
      description: |
        `blocks`: the second item cannot start until the first is done.
        `relates`: navigational only. `duplicate`: the same thing twice.
        `serves`: an item contributes to a goal (`to` is a goal id).
      enum: [blocks, relates, duplicate, serves]
    EdgeSuggestedBy:
      type: string
      description: '`t0Rule` rules, `t1Model` our model, `t2Model` a global model, `user` the user.'
      enum: [t0Rule, t1Model, t2Model, user]
    NewEdge:
      type: object
      required: [id, from, to, kind]
      properties:
        id: {$ref: '#/components/schemas/ULID'}
        from: {$ref: '#/components/schemas/ULID'}
        to: {$ref: '#/components/schemas/ULID'}
        kind: {$ref: '#/components/schemas/EdgeKind'}
    Edge:
      type: object
      required: [id, from, to, kind, confidence, suggestedBy, confirmed]
      properties:
        id: {$ref: '#/components/schemas/ULID'}
        from: {$ref: '#/components/schemas/ULID'}
        to: {$ref: '#/components/schemas/ULID'}
        kind: {$ref: '#/components/schemas/EdgeKind'}
        confidence: {type: number, minimum: 0, maximum: 1}
        suggestedBy: {$ref: '#/components/schemas/EdgeSuggestedBy'}
        confirmed: {type: boolean, description: Only ever true when the user confirmed it.}
    EdgeList:
      type: object
      required: [edges]
      properties:
        edges: {type: array, items: {$ref: '#/components/schemas/Edge'}}

    Why:
      type: object
      description: The numbers behind a ranking, from Brain's scoring.
      required: [unblocks, mayUnblock, servesGoals, mayServeGoals, duePressure]
      properties:
        unblocks: {type: integer, description: Items it unblocks through confirmed links.}
        mayUnblock: {type: integer, description: More it may unblock through suggested links.}
        servesGoals: {type: integer}
        mayServeGoals: {type: integer}
        duePressure: {type: number, minimum: 0}
    RankedItem:
      type: object
      required: [item, reason, why]
      properties:
        item: {$ref: '#/components/schemas/Item'}
        reason: {type: string, description: 'One line for the user, built from facts, never by a model.'}
        why: {$ref: '#/components/schemas/Why'}
    BlockedItem:
      type: object
      required: [item, blockedBy]
      properties:
        item: {$ref: '#/components/schemas/Item'}
        blockedBy: {type: array, items: {$ref: '#/components/schemas/ULID'}, description: Open items that must finish first.}
    Plan:
      type: object
      required: [ranked, quickWins, blocked, computedAt, day, commitments, committedMinutes]
      properties:
        next: {$ref: '#/components/schemas/RankedItem'}
        ranked: {type: array, items: {$ref: '#/components/schemas/RankedItem'}}
        quickWins: {type: array, items: {$ref: '#/components/schemas/RankedItem'}}
        blocked: {type: array, items: {$ref: '#/components/schemas/BlockedItem'}}
        computedAt: {type: string, format: date-time}
        day: {$ref: '#/components/schemas/Day'}
        commitments: {type: array, items: {$ref: '#/components/schemas/ScheduledCommitment'}}
        committedMinutes: {type: integer, minimum: 0}
        bigTask: {$ref: '#/components/schemas/DailyPlan'}
    ScheduledCommitment:
      type: object
      description: |
        One commitment on the plan's day. Payments and rituals first, then
        blocks, then habits. `state` absent means nothing recorded yet.
        `movedFrom` is set when it was moved here from another day (mark it
        with that day); `movedTo` when it was moved away from today.
      required: [commitment]
      properties:
        commitment: {$ref: '#/components/schemas/Commitment'}
        state: {$ref: '#/components/schemas/OccurrenceState'}
        movedFrom: {$ref: '#/components/schemas/Day'}
        movedTo: {$ref: '#/components/schemas/Day'}

    Day:
      type: string
      description: A calendar day, `YYYY-MM-DD`, in the user's timezone.
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      example: '2026-11-24'
    Period:
      type: string
      description: 'A month (`2026-11`) or a calendar quarter (`2026-Q4`; Q1 is January to March).'
      pattern: '^[0-9]{4}-(0[1-9]|1[0-2]|Q[1-4])$'
      example: 2026-Q4

    CommitmentKind:
      type: string
      description: '`habit` read 10 pages · `ritual` Sunday review · `payment` rent on the 4th · `block` Friday 3h office block.'
      enum: [habit, ritual, payment, block]
    Weekday: {type: string, enum: [sunday, monday, tuesday, wednesday, thursday, friday, saturday]}
    Rule:
      type: object
      description: |
        One of five shapes, and only the fields that shape uses (400
        `invalid_rule` otherwise):
        `daily` · `weeklyOn` + weekday · `monthlyOnDay` + day (1–31; the 31st
        falls on the month's last day when shorter) · `monthlyOnNthWeekday` +
        n (1–5) + weekday · `quarterlyOnNthWeekday` + n + weekday (in January,
        April, July, October). A fifth weekday skips months that have none.
      required: [kind]
      properties:
        kind: {type: string, enum: [daily, weeklyOn, monthlyOnDay, monthlyOnNthWeekday, quarterlyOnNthWeekday]}
        weekday: {$ref: '#/components/schemas/Weekday'}
        day: {type: integer, minimum: 1, maximum: 31}
        n: {type: integer, minimum: 1, maximum: 5}
    NewCommitment:
      type: object
      required: [id, title, kind, rule, minutes]
      properties:
        id: {$ref: '#/components/schemas/ULID'}
        title: {type: string, minLength: 1, maxLength: 200}
        kind: {$ref: '#/components/schemas/CommitmentKind'}
        rule: {$ref: '#/components/schemas/Rule'}
        minutes: {type: integer, minimum: 0, maximum: 1440, description: 'The time it takes, as the user states it.'}
        category: {$ref: '#/components/schemas/Category'}
        goalId: {$ref: '#/components/schemas/ULID'}
        startOn: {$ref: '#/components/schemas/Day'}
        endOn: {$ref: '#/components/schemas/Day'}
        paused: {type: boolean, default: false}
        note: {type: string, maxLength: 200, description: 'Free text, e.g. "22k". Never parsed, never added up.'}
    CommitmentUpdate:
      type: object
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        kind: {$ref: '#/components/schemas/CommitmentKind'}
        rule: {$ref: '#/components/schemas/Rule'}
        minutes: {type: integer, minimum: 0, maximum: 1440}
        category: {$ref: '#/components/schemas/Category'}
        goalId: {$ref: '#/components/schemas/ULID'}
        startOn: {$ref: '#/components/schemas/Day'}
        endOn: {$ref: '#/components/schemas/Day'}
        paused: {type: boolean}
        note: {type: string, maxLength: 200}
        clear:
          type: array
          description: Fields to remove. A field may not be both sent and cleared.
          items: {type: string, enum: [category, goalId, endOn, note]}
    Commitment:
      type: object
      required: [id, title, kind, rule, ruleText, minutes, startOn, paused, streak, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/ULID'}
        title: {type: string}
        kind: {$ref: '#/components/schemas/CommitmentKind'}
        rule: {$ref: '#/components/schemas/Rule'}
        ruleText: {type: string, example: Every Friday}
        minutes: {type: integer}
        category: {$ref: '#/components/schemas/Category'}
        goalId: {$ref: '#/components/schemas/ULID'}
        startOn: {$ref: '#/components/schemas/Day'}
        endOn: {$ref: '#/components/schemas/Day'}
        paused: {type: boolean}
        note: {type: string}
        streak: {type: integer, minimum: 0, description: Consecutive done occurrences up to today. Today not yet done does not break it.}
        nextOn: {$ref: '#/components/schemas/Day'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CommitmentList:
      type: object
      required: [commitments]
      properties:
        commitments: {type: array, items: {$ref: '#/components/schemas/Commitment'}}

    OccurrenceState: {type: string, enum: [done, skipped, moved]}
    OccurrenceUpdate:
      type: object
      required: [state]
      properties:
        state: {$ref: '#/components/schemas/OccurrenceState'}
        movedTo: {$ref: '#/components/schemas/Day'}
    Occurrence:
      type: object
      required: [commitmentId, day]
      properties:
        commitmentId: {$ref: '#/components/schemas/ULID'}
        day: {$ref: '#/components/schemas/Day'}
        state: {$ref: '#/components/schemas/OccurrenceState'}
        movedTo: {$ref: '#/components/schemas/Day'}
    OccurrenceList:
      type: object
      required: [occurrences]
      properties:
        occurrences: {type: array, items: {$ref: '#/components/schemas/Occurrence'}}

    JournalWrite:
      type: object
      required: [body]
      properties:
        body: {type: string, minLength: 1, maxLength: 2000}
    JournalEntry:
      type: object
      required: [day, body, createdAt, updatedAt]
      properties:
        day: {$ref: '#/components/schemas/Day'}
        body: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    JournalList:
      type: object
      required: [entries]
      properties:
        entries: {type: array, items: {$ref: '#/components/schemas/JournalEntry'}}

    DailyPlanConfirm:
      type: object
      required: [itemId]
      properties:
        itemId: {$ref: '#/components/schemas/ULID'}
        proposedItemId: {$ref: '#/components/schemas/ULID'}
    DailyPlan:
      type: object
      required: [day, itemId, swapped, confirmedAt]
      properties:
        day: {$ref: '#/components/schemas/Day'}
        itemId: {$ref: '#/components/schemas/ULID'}
        proposedItemId: {$ref: '#/components/schemas/ULID'}
        swapped: {type: boolean}
        confirmedAt: {type: string, format: date-time}
    DailyPlanList:
      type: object
      required: [plans]
      properties:
        plans: {type: array, items: {$ref: '#/components/schemas/DailyPlan'}}

    CommitmentReview:
      type: object
      required: [commitment, expected, done, skipped, moved, missed, streak]
      properties:
        commitment: {$ref: '#/components/schemas/Commitment'}
        expected: {type: integer, description: Days in the range it fell on.}
        done: {type: integer}
        skipped: {type: integer}
        moved: {type: integer, description: Moved to a day that has not passed yet.}
        missed: {type: integer, description: 'Passed with nothing recorded, or moved to a day that passed undone.'}
        hitRate: {type: number, minimum: 0, maximum: 1, description: Done over expected. Absent when nothing was expected.}
        streak: {type: integer, minimum: 0}
    GoalReview:
      type: object
      required: [goal, children]
      properties:
        goal: {$ref: '#/components/schemas/Goal'}
        children: {type: array, items: {$ref: '#/components/schemas/Goal'}, description: Month goals rolling up into this quarter goal.}
    Review:
      type: object
      required: [from, through, commitments, goals, journalEntries, bigTasksConfirmed, bigTasksSwapped]
      properties:
        from: {$ref: '#/components/schemas/Day'}
        through: {$ref: '#/components/schemas/Day'}
        commitments: {type: array, items: {$ref: '#/components/schemas/CommitmentReview'}}
        goals: {type: array, items: {$ref: '#/components/schemas/GoalReview'}}
        journalEntries: {type: integer}
        bigTasksConfirmed: {type: integer}
        bigTasksSwapped: {type: integer}

    Question:
      type: object
      required: [id, captureId, itemId, field, prompt, options, createdAt]
      properties:
        id: {$ref: '#/components/schemas/ULID'}
        captureId: {$ref: '#/components/schemas/ULID'}
        itemId: {$ref: '#/components/schemas/ULID'}
        field: {type: string, description: 'What the answer sets, e.g. `type`.'}
        prompt: {type: string}
        options: {type: array, minItems: 2, items: {type: string}}
        createdAt: {type: string, format: date-time}
    QuestionList:
      type: object
      required: [questions]
      properties:
        questions: {type: array, items: {$ref: '#/components/schemas/Question'}}
    Answer:
      type: object
      required: [option]
      properties:
        option: {type: string, description: "One of the question's `options`, exactly."}
    TargetCount:
      type: integer
      minimum: 1
      maximum: 1000
      description: 'Makes a goal a count goal: this many circles. A count of things, never an amount of money.'
    NewGoalMark:
      type: object
      required: [id]
      properties:
        id: {$ref: '#/components/schemas/ULID'}
        day: {$ref: '#/components/schemas/Day'}
        note: {type: string, minLength: 1, maxLength: 500}
    GoalMarkUpdate:
      type: object
      properties:
        note: {type: string, minLength: 1, maxLength: 500}
        clear:
          type: array
          description: Fields to remove. A field may not be both sent and cleared.
          items: {type: string, enum: [note]}
    GoalMark:
      type: object
      required: [id, goalId, day, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/ULID'}
        goalId: {$ref: '#/components/schemas/ULID'}
        day: {$ref: '#/components/schemas/Day'}
        note: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    GoalMarkList:
      type: object
      required: [marks]
      properties:
        marks: {type: array, items: {$ref: '#/components/schemas/GoalMark'}}
    NewComment:
      type: object
      required: [id, body]
      description: Exactly one of `itemId`, `goalId`, `commitmentId` (else 400 `one_target`).
      properties:
        id: {$ref: '#/components/schemas/ULID'}
        itemId: {$ref: '#/components/schemas/ULID'}
        goalId: {$ref: '#/components/schemas/ULID'}
        commitmentId: {$ref: '#/components/schemas/ULID'}
        body: {type: string, minLength: 1, maxLength: 2000}
    CommentUpdate:
      type: object
      required: [body]
      properties:
        body: {type: string, minLength: 1, maxLength: 2000}
    Comment:
      type: object
      required: [id, body, createdAt, updatedAt]
      description: Exactly one of `itemId`, `goalId`, `commitmentId` is present.
      properties:
        id: {$ref: '#/components/schemas/ULID'}
        itemId: {$ref: '#/components/schemas/ULID'}
        goalId: {$ref: '#/components/schemas/ULID'}
        commitmentId: {$ref: '#/components/schemas/ULID'}
        body: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CommentList:
      type: object
      required: [comments]
      properties:
        comments: {type: array, items: {$ref: '#/components/schemas/Comment'}}
